<nav class="server-nav{% if nav_compact %} server-nav--compact{% endif %}" aria-label="서버 이동">
  <a href="{{ nav.logger }}"{% if nav.current == 'logger' %} class="active" aria-current="page"{% endif %}>로깅</a>
  <a href="{{ nav.analysis }}"{% if nav.current == 'analysis' %} class="active" aria-current="page"{% endif %}>분석</a>
  <a href="{{ nav.camera }}"{% if nav.current == 'camera' %} class="active" aria-current="page"{% endif %}>카메라</a>
  {% if auth_enabled and auth_user %}
  <button type="button" class="server-nav__logout-btn{% if nav_compact %} stop{% endif %}" data-logout-btn>로그아웃</button>
  {% endif %}
</nav>
{% if not nav_compact %}
<style>
  .server-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .server-nav a,
  .server-nav__logout-btn {
    min-height: 38px;
    padding: 0 16px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 700;
    border: 1px solid rgba(120, 160, 220, 0.28);
    background: rgba(10, 16, 28, 0.9);
    color: #dce8ff;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s, background 0.15s;
  }
  .server-nav a:hover {
    border-color: rgba(92, 200, 255, 0.5);
    background: rgba(30, 58, 95, 0.6);
  }
  .server-nav a.active {
    border-color: rgba(92, 200, 255, 0.65);
    background: linear-gradient(180deg, rgba(37, 99, 235, 0.35), rgba(20, 50, 90, 0.5));
    color: #fff;
  }
  .server-nav__logout-btn {
    border-color: rgba(248, 113, 113, 0.35);
    background: rgba(80, 20, 30, 0.45);
    color: #fecdd3;
  }
</style>
{% endif %}
<script>
  document.querySelectorAll('[data-logout-btn]').forEach((button) => {
    button.addEventListener('click', async () => {
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          credentials: 'same-origin',
          cache: 'no-store',
          headers: { 'Accept': 'application/json' },
        });
      } catch (err) {}
      window.location.replace('/login');
    });
  });
</script>
