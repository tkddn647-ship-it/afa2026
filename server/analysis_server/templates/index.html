<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AFA Sync Check</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --ok: #3fb950;
      --bad: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .wrap { max-width: 1500px; margin: 0 auto; padding: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 1.1rem; }
    .sub { color: var(--muted); font-size: 0.85rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .upload-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 8px;
      align-items: end;
    }
    label.field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    input[type="file"], input[type="range"] {
      width: 100%;
      color: var(--text);
      background: #0d1117;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--accent);
      color: #041018;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .status { min-height: 1.1em; color: var(--muted); font-size: 0.85rem; margin: 8px 0; }
    .status.err { color: var(--bad); }
    .status.ok { color: var(--ok); }
    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 42%) 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    video {
      width: 100%;
      max-height: 52vh;
      background: #000;
      border-radius: 8px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin: 8px 0;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .controls { display: grid; gap: 8px; }
    .cols {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 120px;
      overflow: auto;
    }
    .cols label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.72rem;
      color: var(--muted);
      cursor: pointer;
    }
    .cols label.on {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.12);
    }
    .chart-wrap { height: min(62vh, 560px); }
    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
      video { max-height: 40vh; }
      .upload-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>AFA Sync Check</h1>
        <div class="sub">영상 + 센서 그래프 동기화 확인 (후처리/KPI/3D 없음)</div>
      </div>
      <button type="button" class="ghost" id="clearBtn" disabled>세션 닫기</button>
    </header>

    <section class="panel">
      <form id="uploadForm" class="upload-row">
        <label class="field">CSV
          <input type="file" id="csvInput" accept=".csv,text/csv">
        </label>
        <label class="field">영상
          <input type="file" id="videoInput" accept="video/*,.mp4,.avi,.webm,.mov,.mkv">
        </label>
        <button type="submit" id="uploadBtn">업로드</button>
        <button type="button" class="ghost" id="openExistingBtn">기존 세션 열기</button>
      </form>
      <div class="status" id="status">기존 세션이 있으면 자동으로 엽니다. 아니면 CSV+영상을 업로드하세요.</div>
    </section>

    <section class="workspace" id="workspace" hidden>
      <div class="panel">
        <video id="player" controls playsinline></video>
        <div class="meta">
          <span id="metaCsv">CSV: -</span>
          <span id="metaVideo">Video: -</span>
          <span id="metaRows">rows: -</span>
          <span id="metaDur">span: -</span>
          <span id="metaNow">t: 0.00s</span>
        </div>
        <div class="controls">
          <label class="field">오프셋(초) <span id="offsetLabel">0.0</span>
            <input type="range" id="offsetRange" min="-120" max="120" step="0.1" value="0">
          </label>
          <label class="field">윈도우(±초) <span id="windowLabel">15</span>
            <input type="range" id="windowRange" min="5" max="60" step="1" value="15">
          </label>
          <div>
            <div class="sub" style="margin-bottom:4px">그래프 컬럼 (최대 4개)</div>
            <div class="cols" id="colList"></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="sub" style="margin-bottom:6px">재생 위치 기준 앞뒤 윈도우 · 세로선 = now</div>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
      </div>
    </section>
  </div>

  <script>
    const COLORS = ['#58a6ff', '#3fb950', '#d29922', '#f85149', '#a371f7', '#ff7b72'];
    let sessionId = '';
    let columns = [];
    let selected = new Set();
    let chart = null;
    let fetchTimer = null;
    let busy = false;

    const workspace = document.getElementById('workspace');
    const player = document.getElementById('player');
    const offsetRange = document.getElementById('offsetRange');
    const windowRange = document.getElementById('windowRange');

    function setStatus(msg, kind) {
      const el = document.getElementById('status');
      el.className = 'status' + (kind ? ' ' + kind : '');
      el.textContent = msg;
    }

    function renderColumns(cols) {
      columns = cols || [];
      const preferred = ['speed', 'accelX', 'accelY', 'steering_angle', 'break_p', 'accel_p'];
      selected = new Set();
      for (const c of preferred) {
        if (columns.includes(c) && selected.size < 4) selected.add(c);
      }
      if (!selected.size) columns.slice(0, 4).forEach((c) => selected.add(c));

      const box = document.getElementById('colList');
      box.innerHTML = '';
      columns.forEach((col) => {
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = selected.has(col);
        cb.addEventListener('change', () => {
          if (cb.checked) {
            if (selected.size >= 4) {
              cb.checked = false;
              return;
            }
            selected.add(col);
          } else {
            selected.delete(col);
          }
          label.classList.toggle('on', cb.checked);
          scheduleRefresh(true);
        });
        label.classList.toggle('on', cb.checked);
        label.appendChild(cb);
        label.appendChild(document.createTextNode(col));
        box.appendChild(label);
      });
    }

    function ensureChart() {
      if (chart) return chart;
      const ctx = document.getElementById('chart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: { datasets: [] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: 'nearest', intersect: false },
          plugins: {
            legend: { labels: { color: '#e6edf3', boxWidth: 10 } },
            tooltip: { enabled: true },
          },
          scales: {
            x: {
              type: 'linear',
              title: { display: true, text: 'rel sec', color: '#8b949e' },
              ticks: { color: '#8b949e' },
              grid: { color: 'rgba(48,54,61,0.8)' },
            },
            y: {
              ticks: { color: '#8b949e' },
              grid: { color: 'rgba(48,54,61,0.8)' },
            },
          },
        },
        plugins: [{
          id: 'nowLine',
          afterDraw(c) {
            const xScale = c.scales.x;
            const yScale = c.scales.y;
            if (!xScale || !yScale) return;
            const x = xScale.getPixelForValue(0);
            const ctx2 = c.ctx;
            ctx2.save();
            ctx2.strokeStyle = '#f85149';
            ctx2.lineWidth = 1.5;
            ctx2.beginPath();
            ctx2.moveTo(x, yScale.top);
            ctx2.lineTo(x, yScale.bottom);
            ctx2.stroke();
            ctx2.restore();
          },
        }],
      });
      return chart;
    }

    function scheduleRefresh(force) {
      document.getElementById('metaNow').textContent = 't: ' + (player.currentTime || 0).toFixed(2) + 's';
      if (fetchTimer) clearTimeout(fetchTimer);
      fetchTimer = setTimeout(() => refreshChart(force), force ? 0 : 120);
    }

    async function refreshChart() {
      if (!sessionId || busy) return;
      const cols = Array.from(selected);
      if (!cols.length) return;
      busy = true;
      try {
        const t = player.currentTime || 0;
        const offset = Number(offsetRange.value || 0);
        const windowSec = Number(windowRange.value || 15);
        const url = '/api/session/' + sessionId + '/window'
          + '?t=' + encodeURIComponent(t)
          + '&offset=' + encodeURIComponent(offset)
          + '&window=' + encodeURIComponent(windowSec)
          + '&cols=' + encodeURIComponent(cols.join(','));
        const data = await fetch(url, { cache: 'no-store' }).then((r) => r.json());
        if (!data.ok) throw new Error(data.detail || 'window failed');
        const c = ensureChart();
        const xs = data.x || [];
        c.data.datasets = cols.map((col, i) => {
          const ys = (data.series && data.series[col]) || [];
          return {
            label: col,
            data: xs.map((x, idx) => ({ x, y: ys[idx] })),
            borderColor: COLORS[i % COLORS.length],
            backgroundColor: 'transparent',
            pointRadius: 0,
            borderWidth: 1.6,
            tension: 0.05,
          };
        });
        c.update('none');
      } catch (err) {
        // keep quiet during scrub
      } finally {
        busy = false;
      }
    }

    function applySession(data, sid) {
      sessionId = data.session_id || sid;
      workspace.hidden = false;
      document.getElementById('clearBtn').disabled = false;
      document.getElementById('metaCsv').textContent = 'CSV: ' + (data.csv_name || 'data.csv');
      document.getElementById('metaVideo').textContent = 'Video: ' + (data.video_name || 'video');
      document.getElementById('metaRows').textContent = 'rows: ' + (data.row_count || '-');
      document.getElementById('metaDur').textContent = 'span: ' + Number(data.duration_sec || 0).toFixed(1) + 's';
      renderColumns(data.columns || []);
      player.src = (data.video_url || ('/api/session/' + sessionId + '/video')) + '?_=' + Date.now();
      player.load();
      const offset = Number((data.sync && data.sync.offset_sec) || data.offset_sec || 0);
      offsetRange.value = String(offset);
      document.getElementById('offsetLabel').textContent = offset.toFixed(1);
      scheduleRefresh(true);
      setStatus('세션 준비됨 · 오프셋 슬라이더로 싱크 맞추세요 · ' + sessionId, 'ok');
      history.replaceState(null, '', '?session=' + encodeURIComponent(sessionId));
    }

    async function openExistingSession(sid) {
      setStatus('세션 불러오는 중...');
      let res = await fetch('/api/session/' + sid + '/restore', { method: 'POST' });
      let data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        res = await fetch('/api/session/' + sid, { cache: 'no-store' });
        data = await res.json().catch(() => ({}));
      }
      if (!res.ok || !data.ok) throw new Error(data.detail || data.message || 'session open failed');
      applySession(data, sid);
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const csv = document.getElementById('csvInput').files[0];
      const video = document.getElementById('videoInput').files[0];
      if (!csv || !video) {
        setStatus('CSV와 영상을 모두 선택하세요.', 'err');
        return;
      }
      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      setStatus('업로드 중... (후처리 없이 sync만)');
      try {
        const body = new FormData();
        body.append('csv_file', csv);
        body.append('video_file', video);
        const res = await fetch('/api/upload', { method: 'POST', body });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          const detail = data.detail;
          const msg = Array.isArray(detail)
            ? detail.map((d) => d.msg || JSON.stringify(d)).join('; ')
            : (detail || data.message || 'upload failed');
          throw new Error(msg);
        }
        applySession(data, data.session_id);
      } catch (err) {
        setStatus('업로드 실패: ' + (err.message || err), 'err');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('openExistingBtn').addEventListener('click', async () => {
      try {
        const list = await fetch('/api/sessions', { cache: 'no-store' }).then((r) => r.json());
        const sid = (list.sessions && list.sessions[0] && list.sessions[0].session_id)
          || (list.disk_sessions && list.disk_sessions[0]);
        if (!sid) {
          setStatus('열려 있는/디스크 세션이 없습니다.', 'err');
          return;
        }
        await openExistingSession(sid);
      } catch (err) {
        setStatus('세션 열기 실패: ' + (err.message || err), 'err');
      }
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
      sessionId = '';
      player.removeAttribute('src');
      player.load();
      workspace.hidden = true;
      document.getElementById('clearBtn').disabled = true;
      if (chart) { chart.destroy(); chart = null; }
      history.replaceState(null, '', location.pathname);
      setStatus('세션을 닫았습니다. (파일은 서버에 남아 있습니다)');
    });

    offsetRange.addEventListener('input', () => {
      document.getElementById('offsetLabel').textContent = Number(offsetRange.value).toFixed(1);
      scheduleRefresh(true);
    });
    windowRange.addEventListener('input', () => {
      document.getElementById('windowLabel').textContent = String(windowRange.value);
      scheduleRefresh(true);
    });
    ['timeupdate', 'seeked', 'play', 'pause'].forEach((ev) => {
      player.addEventListener(ev, () => scheduleRefresh(ev !== 'timeupdate'));
    });

    (async function boot() {
      const params = new URLSearchParams(location.search);
      const sid = params.get('session');
      try {
        if (sid) {
          await openExistingSession(sid);
          return;
        }
        const list = await fetch('/api/sessions', { cache: 'no-store' }).then((r) => r.json());
        if (list && list.ok) {
          if (list.sessions && list.sessions.length === 1) {
            await openExistingSession(list.sessions[0].session_id);
          } else if (list.disk_sessions && list.disk_sessions.length === 1) {
            await openExistingSession(list.disk_sessions[0]);
          }
        }
      } catch (err) {
        setStatus('자동 세션 열기 실패: ' + (err.message || err), 'err');
      }
    })();
  </script>
</body>
</html>
