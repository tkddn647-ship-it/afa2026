server {
  listen 80;
  server_name your.domain.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  client_max_body_size 200M;

  server_name your.domain.example;

  ssl_certificate /etc/letsencrypt/live/your.domain.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your.domain.example/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options nosniff always;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 600s;
  proxy_send_timeout 600s;
  proxy_read_timeout 600s;

  location = /live {
    return 301 https://$host/live/;
  }

  location /live/ {
    proxy_set_header X-Forwarded-Prefix /live/;
    proxy_pass http://127.0.0.1:8011/;
  }

  location = /camera {
    return 301 https://$host/camera/;
  }

  location /camera/ {
    proxy_set_header X-Forwarded-Prefix /camera/;
    proxy_pass http://127.0.0.1:8012/;
    proxy_buffering off;
  }

  location = /analysis {
    return 301 https://$host/analysis/;
  }

  location /analysis/ {
    proxy_set_header X-Forwarded-Prefix /analysis/;
    proxy_pass http://127.0.0.1:8013/;
    client_max_body_size 500M;
    # remux/proxy 변환이 길 수 있음
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  location / {
    proxy_pass http://127.0.0.1:8000;
  }
}
